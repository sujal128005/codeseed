name: Update YouTube & Instagram feed

on:
  schedule:
    - cron: "17 * * * *"        # every hour
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    paths: ["config.js", "scripts/**", ".github/workflows/**"]   # runs right after an upload

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest videos, Shorts and posts
        run: node scripts/update-feed.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # optional, see README
      - name: Commit if anything changed
        run: |
          git config user.name "tathvi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.js
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
